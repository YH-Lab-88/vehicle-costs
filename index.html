<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12312b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VAN车" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VAN车</title>
    <link rel="icon" type="image/png" href="./vehicle-logo.png?v=63" />
    <link rel="apple-touch-icon" href="./vehicle-logo.png?v=63" />
    <link rel="manifest" href="./manifest.webmanifest?v=63" />
    <link rel="stylesheet" href="./styles.css?v=qna-links-1" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Google Sheet 实时数据</p>
          <h1>VAN车</h1>
        </div>
        <div class="top-actions">
          <button class="finance-button" id="financeButton" type="button" title="显示财政金额" aria-label="显示财政金额">财政</button>
          <button class="icon-button" id="refreshButton" type="button" title="刷新数据" aria-label="刷新数据">↻</button>
        </div>
      </header>

      <dialog class="finance-dialog" id="financeDialog">
        <form method="dialog" id="financeForm">
          <h2>财政</h2>
          <p>请输入密码后显示金额</p>
          <input id="financePassword" type="password" inputmode="numeric" autocomplete="off" placeholder="密码" aria-label="财政密码" />
          <div class="finance-dialog-actions">
            <button type="submit" value="cancel">取消</button>
            <button class="primary" type="submit" value="unlock">打开</button>
          </div>
          <small class="finance-error" id="financeError"></small>
        </form>
      </dialog>

      <section class="summary-strip" aria-label="总览">
        <div class="metric">
          <span id="totalLabel">总花费</span>
          <strong id="totalAmount">0</strong>
        </div>
        <div class="metric">
          <span>车辆</span>
          <strong id="vehicleCount">0</strong>
        </div>
        <div class="metric">
          <span id="recordLabel">记录</span>
          <strong id="recordCount">0</strong>
        </div>
      </section>

      <section class="controls" aria-label="筛选">
        <label>
          年份
          <select id="yearFilter"></select>
        </label>
        <label>
          月份
          <select id="monthFilter"></select>
        </label>
        <label>
          类别
          <select id="branchFilter"></select>
        </label>
        <label>
          车辆
          <select id="vehicleFilter"></select>
        </label>
      </section>

      <nav class="tabs" aria-label="查看方式">
        <div class="tab-row tab-row-primary">
        <button class="tab active" type="button" data-view="progress">维修进度</button>
        <button class="tab" type="button" data-view="qna">QnA</button>
        <button class="tab" type="button" data-view="service-month">保养月份</button>
        <button class="tab" type="button" data-view="service-mileage">保养里数</button>
        </div>
        <div class="tab-row tab-row-secondary">
        <button class="tab" type="button" data-view="month">按月</button>
        <button class="tab" type="button" data-view="year">按年</button>
        <button class="tab" type="button" data-view="vehicle">按车辆</button>
        </div>
      </nav>

      <p class="status" id="statusText">正在读取表格...</p>

      <section class="chart-panel" aria-label="费用图表">
        <div class="chart-heading">
          <h2 id="chartTitle">费用走势</h2>
          <span id="lastUpdated"></span>
        </div>
        <div class="bar-chart" id="barChart"></div>
      </section>

      <section class="vehicle-list" aria-label="车辆明细">
        <div class="section-heading">
          <h2 id="detailTitle">车辆明细</h2>
          <span id="listHint"></span>
        </div>
        <p class="progress-legend" id="progressLegend">1. 等柜台确认 · 2. 日期已确认 · 3. 车已开走 · 4. 已经完成</p>
        <div id="vehicleList"></div>
      </section>
    </main>

    <script src="./app.js?v=qna-brand-icons-1"></script>
  </body>
</html>
