<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b34" />
    <title>公帐 RM2026</title>
    <link rel="stylesheet" href="./styles.css?v=rm2026-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">RM2026</p>
          <h1>公帐记录</h1>
          <p class="subtitle">新增一笔资料，直接写入 Google Sheet</p>
        </div>
        <div class="balance-box" aria-label="Balance">
          <span>Balance</span>
          <strong id="balanceAmount">RM —</strong>
        </div>
      </header>

      <section class="card">
        <form id="entryForm">
          <label>日期 <input id="date" name="date" type="date" required /></label>
          <label>项目 <input id="item" name="item" type="text" placeholder="例如：晚餐、维修" required /></label>
          <label>备注 <input id="other" name="other" type="text" placeholder="可不填" /></label>

          <div class="money-grid">
            <label>进账（DT）<input id="dt" name="dt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" /></label>
            <label>出账（KT）<input id="kt" name="kt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" /></label>
          </div>

          <button class="primary-button" type="submit">保存到 RM2026</button>
          <p class="form-hint">进账和出账至少填写一项。</p>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card guide">
        <div class="section-title"><h2>最近记录</h2><button id="clearButton" class="text-button" type="button">清除本机记录</button></div>
        <div id="recentList" class="recent-list"><p class="empty">还没有本机记录</p></div>
      </section>
    </main>
    <script src="./app.js?v=rm2026-1"></script>
  </body>
</html>
